<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register | WPS Academy</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="auth-page"><div class="auth-card"><a class="brand" href="/">WPS <span>Academy</span></a>
<h1>Create account</h1><p>After registration you will be redirected to the payment portal.</p>
<form id="registerForm"><label>Full name<input id="name" required></label><label>Email<input id="email" type="email" required></label>
<label>Password<input id="password" type="password" minlength="8" required></label><label>Confirm password<input id="confirm" type="password" required></label>
<div class="ai-cost-grid"><label>Gender<select id="gender"><option value="">Select gender</option><option>Male</option><option>Female</option><option>Other</option><option>Prefer not to say</option></select></label><label>State<input id="state" maxlength="80" placeholder="e.g. Rivers"></label><label>Country<input id="country" maxlength="80" value="Nigeria"></label></div>
<label>Profile picture <span class="muted">(optional)</span><input id="profilePicture" name="profilePicture" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp"></label><small>JPG, PNG or WEBP. Maximum 5 MB.</small>
<label>Choose course(s)<select id="courseIds" name="courseIds" multiple required size="6"></select></label><small>Select every course you are registering for. You will only receive access to courses selected here and approved by the administrator.</small>
<button class="btn full">Create Account</button></form><p id="msg" class="msg"></p><p>Already registered? <a href="/login.html">Login</a></p></div>
<script src="/js/auth.js?v=20260928studentidentity"></script></body></html>
