<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMARTTEP Learning Library</title><link rel="stylesheet" href="/css/style.css"><link rel="manifest" href="/manifest.webmanifest"></head><body><header class="nav"><a class="brand" href="/"><img class="brand-logo" src="/images/smarttep-academy-logo.png" alt="SMARTTEP ACADEMY"><span>SMARTTEP ACADEMY</span></a><nav><a href="/">Home</a><a href="/login.html">Login</a></nav></header><main class="section"><h1>📚 SMARTTEP Learning Library</h1><p>Practical educational articles from SMARTTEP ACADEMY courses. Automobile Mechanic is not included in this library.</p><div class="ad-admin-grid"><label>Course filter<select id="libraryCourse"><option value="">All available courses</option></select></label><label>Search<input id="librarySearch" placeholder="Search articles"></label></div><div id="libraryArticles" class="grid">Loading articles…</div></main><script>let all=[];const esc=s=>String(s||'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const [a,c]=await Promise.all([fetch('/api/public/articles').then(r=>r.json()),fetch('/api/public-courses').then(r=>r.json())]);all=a.articles||[];const seen=new Map();(c.courses||[]).filter(x=>!/^automobile\s+mechanic$/i.test(x.title)).forEach(x=>seen.set(x.id,x.title));document.getElementById('libraryCourse').innerHTML='<option value="">All available courses</option>'+[...seen].sort((a,b)=>a[1].localeCompare(b[1])).map(x=>'<option value="'+x[0]+'">'+esc(x[1])+'</option>').join('');render()}function render(){const q=document.getElementById('librarySearch').value.toLowerCase().trim(),cid=document.getElementById('libraryCourse').value;const rows=all.filter(x=>(!cid||x.courseId===cid)&&(!q||(`${x.title} ${x.excerpt} ${x.courseTitle}`).toLowerCase().includes(q)));document.getElementById('libraryArticles').innerHTML=rows.length?rows.map(x=>'<article class="panel"><small>'+esc(x.courseTitle)+'</small><h2>'+esc(x.title)+'</h2><p>'+esc(x.excerpt)+'</p><a class="btn small" href="/article.html?id='+encodeURIComponent(x.id)+'">Read article</a></article>').join(''):'<p>No matching articles yet.</p>'}document.getElementById('librarySearch').oninput=render;document.getElementById('libraryCourse').onchange=render;load().catch(e=>document.getElementById('libraryArticles').textContent=e.message);</script></body></html>
