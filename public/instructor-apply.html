<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teach on WPS Academy</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="auth-page"><div class="auth-card"><a class="brand" href="/">WPS <span>Academy</span></a><h1>Teach on WPS Academy</h1>
<p>Create and manage your own courses, lessons, assignments and students after administrator approval.</p>
<div id="status" class="msg"></div><form id="applyForm"><label>What do you want to teach?<textarea id="teachingTopics" maxlength="1000" required placeholder="e.g. Python, web development, graphic design..."></textarea></label><label>Tell the administrator about your teaching plan<textarea id="message" maxlength="2000" required placeholder="Briefly describe your experience and the course you want to create."></textarea></label><button class="btn full">Submit Instructor Application</button></form>
<p><a href="/login.html">Login</a> · <a href="/">Back to WPS Academy</a></p></div><script>
async function api(u,o={}){const r=await fetch(u,o);let d={};try{d=await r.json()}catch{};if(!r.ok)throw Error(d.error||'Request failed');return d}
(async()=>{try{const me=await api('/api/me');if(!me.user){document.getElementById('status').textContent='Please log in first, then return to this page.';document.getElementById('applyForm').style.display='none';return}
const s=await api('/api/instructor/status');if(s.approved){location='/instructor.html';return} if(s.application?.status==='pending')document.getElementById('status').textContent='Your application is already awaiting administrator review.';
if(s.application?.status==='rejected')document.getElementById('status').textContent='Your previous application was not approved. You may submit a new application.';
}catch(e){document.getElementById('status').textContent=e.message}}
)();
document.getElementById('applyForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/instructor/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({teachingTopics:teachingTopics.value,message:message.value})});status.textContent=d.message;applyForm.reset()}catch(e){status.textContent=e.message}};
</script></body></html>
