<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article | SMARTTEP ACADEMY</title><link rel="stylesheet" href="/css/style.css"><link rel="manifest" href="/manifest.webmanifest"></head><body><header class="nav"><a class="brand" href="/"><img class="brand-logo" src="/images/smarttep-academy-logo.png" alt="SMARTTEP ACADEMY"><span>SMARTTEP ACADEMY</span></a><nav><a href="/learning-library.html">Learning Library</a></nav></header><main class="narrow"><article class="panel" id="article">Loading…</article></main><script>const esc=s=>String(s||'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');fetch('/api/public/articles/'+encodeURIComponent(id||'')).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||'Article not found');const a=d.article;document.title=a.title+' | SMARTTEP ACADEMY';document.getElementById('article').innerHTML='<small>'+esc(a.courseTitle)+' · '+new Date(a.publishedAt).toLocaleDateString()+'</small><h1>'+esc(a.title)+'</h1><p><b>'+esc(a.excerpt)+'</b></p><hr><div style="white-space:pre-wrap;line-height:1.75">'+esc(a.body)+'</div><p><small>Published by '+esc(a.authorName)+'</small></p>'}).catch(e=>document.getElementById('article').innerHTML='<p class="msg">'+esc(e.message)+'</p>');</script></body></html>
