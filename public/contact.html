<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7874038162382392" crossorigin="anonymous"></script>
</head><body><header class="nav"><a class="brand" href="/" aria-label="SMARTTEP ACADEMY"><img class="brand-logo" src="/images/smarttep-academy-logo.png" alt="SMARTTEP ACADEMY"><span>SMARTTEP ACADEMY</span></a><nav><a href="/">Home</a><a href="/about.html">About</a><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a></nav></header><main class="section"><div class="panel narrow"><h1>Contact SMARTTEP ACADEMY</h1><p>Use this page for questions about courses, accounts, instructor applications, certificates, privacy, advertising, or other platform matters.</p><p id="contactEmailLine">Loading the academy support contact…</p><form id="contactForm"><label>Name<input id="contactName" maxlength="100" required autocomplete="name"></label><label>Email<input id="contactEmail" type="email" maxlength="160" required autocomplete="email"></label><label>Message<textarea id="contactMessage" maxlength="3000" rows="8" required placeholder="How can SMARTTEP ACADEMY help?"></textarea></label><button class="btn" type="submit">Send message</button><p id="contactMsg" class="msg" role="status" aria-live="polite"></p></form></div></main><footer>© SMARTTEP ACADEMY · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a> · <a href="/about.html">About</a></footer><script>
(async()=>{try{const r=await fetch('/api/public/contact-info');const d=await r.json();if(d.email){document.getElementById('contactEmailLine').innerHTML='Support email: <a href="mailto:'+String(d.email).replace(/[^a-zA-Z0-9@._+\-]/g,'')+'">'+String(d.email).replace(/[<>&"']/g,'')+'</a>'}}catch(_){document.getElementById('contactEmailLine').textContent='Please use the form below to contact SMARTTEP ACADEMY.'}})();
document.getElementById('contactForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('contactMsg');msg.textContent='Sending…';try{const r=await fetch('/api/public/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('contactName').value,email:document.getElementById('contactEmail').value,message:document.getElementById('contactMessage').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to send message.');msg.textContent='Your message has been received. SMARTTEP ACADEMY will review it.';e.target.reset()}catch(err){msg.textContent=err.message||'Unable to send message. Please try again.'}});
</script></body></html>
