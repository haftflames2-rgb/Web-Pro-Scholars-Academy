<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Certificate | SMARTTEP ACADEMY</title><link rel="stylesheet" href="/css/style.css"><link rel="manifest" href="/manifest.webmanifest"></head><body><header class="nav"><a class="brand" href="/"><img class="brand-logo" src="/images/smarttep-academy-logo.png" alt="SMARTTEP ACADEMY"><span>SMARTTEP ACADEMY</span></a><nav><a href="/">Home</a></nav></header><main class="narrow"><div class="panel" id="verification"><h1>Certificate verification</h1><p>Checking certificate…</p></div></main><script>const box=document.getElementById('verification');const id=new URLSearchParams(location.search).get('id');fetch('/api/public/certificates/'+encodeURIComponent(id||''),{credentials:'omit'}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||'Certificate not found.');box.innerHTML='<h1>✅ Certificate verified</h1><p>This certificate was issued by <b>SMARTTEP ACADEMY</b>.</p><div class="row"><b>Certificate No.</b><span>'+String(d.certificateNumber).replace(/[<>&"']/g,'')+'</span></div><div class="row"><b>Name</b><span>'+String(d.name).replace(/[<>&"']/g,'')+'</span></div><div class="row"><b>Course</b><span>'+String(d.course).replace(/[<>&"']/g,'')+'</span></div><div class="row"><b>Student ID</b><span>'+String(d.idNumber||'N/A').replace(/[<>&"']/g,'')+'</span></div><div class="row"><b>Issued</b><span>'+new Date(d.issuedAt).toLocaleDateString()+'</span></div>';}).catch(e=>box.innerHTML='<h1>Certificate not verified</h1><p class="msg">'+String(e.message).replace(/[<>&"']/g,'')+'</p>');</script></body></html>
