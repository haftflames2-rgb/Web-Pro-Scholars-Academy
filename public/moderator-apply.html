<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply to Become a Moderator | SMARTTEP ACADEMY</title><link rel="stylesheet" href="/css/style.css"></head><body class="auth-page"><div class="auth-card"><a class="brand" href="/"><img class="brand-logo" src="/images/smarttep-academy-logo.png" alt="SMARTTEP ACADEMY"><span>SMARTTEP ACADEMY</span></a><h1>Moderator Application</h1><p>Apply to help manage lessons, attendance or assignment review. Applying does not automatically grant portal access; the administrator must approve you.</p><form id="applyForm"><label>Full name<input name="name" maxlength="120" required></label><label>Email address<input name="email" type="email" maxlength="254" required></label><label>Area of expertise<input name="expertise" maxlength="300" placeholder="e.g. Python, Web Development, assignment grading" required></label><label>Why do you want to become a moderator?<textarea name="message" maxlength="2000" rows="5"></textarea></label><button class="btn full">Submit application</button></form><p id="msg" class="msg"></p><p><a href="/login.html">Already have an account? Sign in</a></p></div><script>
const form=document.getElementById('applyForm'),msg=document.getElementById('msg');form.addEventListener('submit',async e=>{e.preventDefault();try{const r=await fetch('/api/moderator/applications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not submit application');msg.textContent=d.message;form.reset()}catch(e){msg.textContent=e.message}});
</script></body></html>
